services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spamer}
      POSTGRES_USER: ${POSTGRES_USER:-spamer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - spamer_pg:/var/lib/postgresql/data
    networks:
      - spamer_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spamer} -d ${POSTGRES_DB:-spamer}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-spamer}
      DATABASE_USER: ${POSTGRES_USER:-spamer}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      VICTIM_BASE_URL: http://app:8080
    networks:
      - spamer_internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - spamer_internal
    depends_on:
      app:
        condition: service_healthy

networks:
  spamer_internal:
    driver: bridge

volumes:
  spamer_pg:
  caddy_data:
  caddy_config:
