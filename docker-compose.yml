services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: spamer
      POSTGRES_USER: spamer
      POSTGRES_PASSWORD: spamer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spamer -d spamer"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/spamer
      DB_USERNAME: spamer
      DB_PASSWORD: spamer
    ports:
      - "8080:8080"

volumes:
  pgdata:
