services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spamer
      POSTGRES_USER: spamer
      POSTGRES_PASSWORD: spamer
    volumes:
      - spamer_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spamer -d spamer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/spamer
      DATABASE_USER: spamer
      DATABASE_PASSWORD: spamer
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-in-production-32chars}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      VICTIM_BASE_URL: http://app:8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  spamer_pg:
