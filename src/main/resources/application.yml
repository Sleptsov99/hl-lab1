server:
  port: 8080

spring:
  application:
    name: spamer-monolith
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spamer}
    username: ${DB_USERNAME:spamer}
    password: ${DB_PASSWORD:spamer}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

spamer:
  sender:
    # Where /spam/send actually POSTs. Points at the built-in test receiver by
    # default; override with SENDER_TARGET_URL to hit your own test server.
    target-url: ${SENDER_TARGET_URL:http://localhost:8080/api/v1/test-receiver/inbox}
    connect-timeout-ms: ${SENDER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SENDER_READ_TIMEOUT_MS:5000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
