databaseChangeLog:
  - changeSet:
      id: 002-create-services
      author: lab
      changes:
        - createTable:
            tableName: services
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(128)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: text
              - column:
                  name: price_per_message
                  type: numeric(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE services ADD CONSTRAINT chk_services_price_positive
              CHECK (price_per_message > 0)
