<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spamer — Auth Stress Test</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container">
    <header>
        <h1>Spamer</h1>
        <p class="subtitle">Внутренний инструмент стресс-тестирования auth API</p>
    </header>

    <section id="auth-section" class="card">
        <h2>Вход</h2>
        <form id="login-form">
            <label>Логин <input type="text" id="username" required autocomplete="username"></label>
            <label>Пароль <input type="password" id="password" required autocomplete="current-password"></label>
            <button type="submit">Войти</button>
        </form>

        <div class="creds-box">
            <h3>Тестовый доступ</h3>
            <table class="creds-table">
                <tr><td>Юзер (free)</td><td><code>tester</code></td><td><code>test123</code></td></tr>
                <tr><td>Телефон для OTP</td><td colspan="2"><code>89312894756</code></td></tr>
            </table>
            <div class="quick-login">
                <button type="button" id="login-tester-btn" class="btn-secondary">Войти как tester</button>
            </div>
        </div>
        <p id="auth-error" class="error"></p>
    </section>

    <section id="app-section" class="hidden">
        <div class="toolbar">
            <span id="user-info"></span>
            <button id="logout-btn" type="button" class="btn-secondary">Выйти</button>
        </div>

        <nav class="tabs">
            <button type="button" class="tab active" data-tab="campaigns">Кампании</button>
            <button type="button" class="tab hidden" data-tab="admin" id="admin-tab">Сервисы</button>
        </nav>

        <div id="tab-campaigns" class="tab-panel">
            <div class="grid">
                <div class="card">
                    <h2>Новая кампания</h2>
                    <form id="campaign-form">
                        <label>Название <input type="text" id="campaign-name" placeholder="yandex otp flood" required></label>
                        <label>Сервис
                            <select id="service-id" required></select>
                        </label>
                        <label>Target (телефон / email)
                            <div class="input-row">
                                <input type="text" id="target-email" value="89312894756" required>
                                <button type="button" id="fill-phone-btn" class="btn-secondary btn-small">тест</button>
                            </div>
                        </label>
                        <label>Всего запросов <input type="number" id="total-requests" min="1" max="100000" value="100"></label>
                        <label>RPS <input type="number" id="rate" min="1" value="5"></label>
                        <label>Concurrency <input type="number" id="concurrency" min="1" max="50" value="3"></label>
                        <button type="submit">Запустить</button>
                    </form>
                    <p id="campaign-error" class="error"></p>
                </div>

                <div class="card">
                    <h2>Кампании</h2>
                    <button id="refresh-btn" type="button" class="btn-secondary">Обновить</button>
                    <div id="campaigns-list"></div>
                </div>
            </div>
        </div>

        <div id="tab-admin" class="tab-panel hidden">
            <div class="grid">
                <div class="card">
                    <h2>Добавить сервис</h2>
                    <form id="service-form">
                        <label>Название <input type="text" id="svc-name" placeholder="Yandex Auth" required></label>
                        <label>Base URL <input type="url" id="svc-base-url" placeholder="http://app:8080" required></label>
                        <label>Endpoint path <input type="text" id="svc-path" placeholder="/api/victim/yandex/otp" required></label>
                        <label>Тип
                            <select id="svc-type" required>
                                <option value="OTP_REQUEST">OTP_REQUEST</option>
                                <option value="PASSWORD_RESET">PASSWORD_RESET</option>
                                <option value="LOGIN">LOGIN</option>
                                <option value="REGISTER">REGISTER</option>
                                <option value="CUSTOM">CUSTOM</option>
                            </select>
                        </label>
                        <label>HTTP метод
                            <select id="svc-method">
                                <option value="POST">POST</option>
                                <option value="GET">GET</option>
                                <option value="PUT">PUT</option>
                            </select>
                        </label>
                        <label>Body template
                            <textarea id="svc-body" rows="4" placeholder='{"phone":"{{phone}}"}'></textarea>
                        </label>
                        <p class="hint">Плейсхолдеры: <code>{{phone}}</code>, <code>{{email}}</code></p>
                        <button type="submit">Добавить</button>
                    </form>
                    <p id="service-error" class="error"></p>
                    <p id="service-success" class="success"></p>
                </div>

                <div class="card">
                    <h2>Сервисы</h2>
                    <button id="refresh-services-btn" type="button" class="btn-secondary">Обновить</button>
                    <div id="services-list"></div>
                </div>
            </div>
        </div>
    </section>
</div>
<script src="/app.js"></script>
</body>
</html>
