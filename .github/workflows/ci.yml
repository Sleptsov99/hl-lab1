name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Run on the runner directly (not inside a container) so Testcontainers
      # can reach the host Docker daemon. verify enforces the JaCoCo 70% gate.
      - name: Build, test and coverage gate
        run: mvn -B verify

      - name: Build Docker image
        run: docker build -t spamer-monolith:ci .
